<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MC Armenia — Minecraft Mods</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:#050907;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    z-index:-5;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(43,255,105,.12),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(0,170,255,.10),transparent 30%),
        linear-gradient(135deg,#050907,#0a120d 50%,#030604);
}

.grid-bg{
    position:absolute;
    inset:-50%;
    opacity:.15;
    background-image:
        linear-gradient(rgba(60,255,110,.15) 1px,transparent 1px),
        linear-gradient(90deg,rgba(60,255,110,.15) 1px,transparent 1px);
    background-size:60px 60px;
    transform:perspective(500px) rotateX(60deg);
    animation:gridMove 15s linear infinite;
}

@keyframes gridMove{
    from{ transform:perspective(500px) rotateX(60deg) translateY(0); }
    to{ transform:perspective(500px) rotateX(60deg) translateY(60px); }
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    animation:orbFloat 8s ease-in-out infinite;
}

.orb.one{
    width:300px;
    height:300px;
    background:#17b94b;
    left:-100px;
    top:20%;
    opacity:.15;
}

.orb.two{
    width:350px;
    height:350px;
    background:#0877ff;
    right:-150px;
    bottom:5%;
    opacity:.12;
    animation-delay:2s;
}

@keyframes orbFloat{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(40px,-30px); }
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#4cff76;
    box-shadow:0 0 10px #4cff76;
    animation:particleMove linear infinite;
}

@keyframes particleMove{
    from{ transform:translateY(110vh); opacity:0; }
    20%{ opacity:1; }
    80%{ opacity:1; }
    to{ transform:translateY(-10vh); opacity:0; }
}

/* =========================
   HEADER
========================= */

header{
    position:relative;
    min-height:420px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 20px;
    border-bottom:1px solid rgba(90,255,120,.15);
    background:
        linear-gradient(
            rgba(3,10,5,.55),
            rgba(3,10,5,.85)
        );
}

.hero{
    max-width:900px;
    animation:heroAppear 1s ease forwards;
}

@keyframes heroAppear{
    from{ opacity:0; transform:translateY(35px); }
    to{ opacity:1; transform:translateY(0); }
}

.logo{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:90px;
    height:90px;
    font-size:48px;
    border-radius:25px;
    background: linear-gradient(135deg,#1fcf58,#087f32);
    box-shadow: 0 0 50px rgba(45,220,90,.35), inset 0 0 25px rgba(255,255,255,.08);
    animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-10px) rotate(2deg); }
}

.hero h1{
    margin:25px 0 10px;
    font-size:clamp(40px,7vw,78px);
    font-weight:900;
    letter-spacing:-3px;
    background: linear-gradient(90deg, #ffffff, #55ff7b, #ffffff);
    background-size:200% auto;
    color:transparent;
    -webkit-background-clip:text;
    animation:textShine 4s linear infinite;
}

@keyframes textShine{
    to{ background-position:200% center; }
}

.hero p{
    color:#b9cbbd;
    font-size:19px;
}

.hero-buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

/* =========================
   BUTTONS
========================= */

.btn{
    border:0;
    padding:14px 24px;
    border-radius:13px;
    color:white;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    background: linear-gradient(135deg, #29bd52, #178538);
    box-shadow: 0 8px 25px rgba(25,190,75,.18);
    transition:.25s;
}

.btn:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow: 0 12px 35px rgba(25,220,75,.35);
}

.btn.secondary{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
}

/* =========================
   MAIN
========================= */

.container{
    width:min(1250px,92%);
    margin:auto;
    padding:55px 0;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:22px;
}

.section-head h2{
    margin:0;
    font-size:32px;
}

.section-head p{
    margin:6px 0 0;
    color:#8fa497;
}

/* =========================
   CONTROLS
========================= */

.panel{
    padding:18px;
    border-radius:20px;
    background: rgba(17,28,20,.72);
    border: 1px solid rgba(100,255,130,.12);
    backdrop-filter:blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    margin-bottom:30px;
}

.controls{
    display:grid;
    grid-template-columns: minmax(200px,1fr) 180px 180px 150px;
    gap:10px;
}

.input, .select{
    width:100%;
    padding:14px 15px;
    color:#fff;
    background:#101a13;
    border: 1px solid rgba(255,255,255,.10);
    border-radius:12px;
    outline:none;
    transition:.2s;
}

.input:focus, .select:focus{
    border-color:#37d65d;
    box-shadow: 0 0 0 3px rgba(55,214,93,.08);
}

.status{
    margin:20px 0;
    min-height:22px;
    color:#a6c6ad;
}

.loader-hidden{
    display:none;
}

/* =========================
   CARDS & GRID
========================= */

.grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap:20px;
}

.card{
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    height:100%;
    overflow:hidden;
    border-radius:20px;
    background: linear-gradient(145deg, rgba(27,40,30,.94), rgba(12,20,14,.94));
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 15px 40px rgba(0,0,0,.28);
    transition: transform .35s, box-shadow .35s, border-color .35s;
    animation:cardAppear .55s ease both;
}

.card:hover{
    transform: translateY(-9px);
    border-color: rgba(65,235,100,.38);
    box-shadow: 0 25px 60px rgba(0,0,0,.45), 0 0 35px rgba(40,220,80,.08);
}

@keyframes cardAppear{
    from{ opacity:0; transform:translateY(25px) scale(.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

/* ՈՒՂՂՎԱԾ՝ ՆԿԱՐՆԵՐԸ ՍԻՐՈՒՆ ՏԵՂԱՎՈՐՎՈՒՄ ԵՆ ՔԱՐՏԻ ՆԵՐՍՈՒՄ */
.card-image-box{
    width:100%;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b120d;
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.card-image{
    max-width:100%;
    max-height:100%;
    object-fit:contain; /* Նկարը չի կտրվում և դուրս չի գալիս քարտից */
    transition:.4s;
}

.card:hover .card-image{
    transform:scale(1.08);
}

.card-body{
    padding:18px;
    display:flex;
    flex-direction:column;
    flex-grow:1;
    justify-content:space-between;
}

.card-title{
    margin:0 0 8px;
    font-size:20px;
    font-weight:900;
}

.card-description{
    min-height:60px;
    color:#aebdb2;
    line-height:1.4;
    font-size:13px;
    margin-bottom:12px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:12px;
}

.tag{
    padding:5px 9px;
    border-radius:8px;
    font-size:11px;
    color:#a8eeb7;
    background: rgba(55,210,90,.08);
    border: 1px solid rgba(55,210,90,.12);
}

.card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:auto;
}

.download-btn{
    flex:1;
    border:0;
    padding:10px;
    border-radius:10px;
    color:white;
    background: linear-gradient(135deg, #2ecf58, #17853a);
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}

.download-btn:hover{
    filter:brightness(1.12);
    transform:translateY(-2px);
}

.downloads{
    color:#789080;
    font-size:12px;
}

/* =========================
   EMPTY & LOADING
========================= */

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    border-radius:20px;
    background: rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.06);
    color:#829488;
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

.loading{
    grid-column:1/-1;
    display:flex;
    justify-content:center;
    padding:60px;
}

.spinner{
    width:50px;
    height:50px;
    border-radius:50%;
    border: 4px solid rgba(255,255,255,.08);
    border-top-color:#45dc66;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

/* =========================
   DOWNLOAD MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background: rgba(0,0,0,.75);
    backdrop-filter:blur(10px);
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(500px,100%);
    padding:30px;
    border-radius:22px;
    background:#111a13;
    border: 1px solid rgba(80,230,100,.2);
    box-shadow: 0 30px 100px rgba(0,0,0,.6);
    animation:modalIn .3s ease;
}

@keyframes modalIn{
    from{ opacity:0; transform:scale(.9) translateY(20px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
}

.progress{
    height:8px;
    margin-top:20px;
    overflow:hidden;
    border-radius:20px;
    background:#202a22;
}

.progress-bar{
    width:0%;
    height:100%;
    background: linear-gradient(90deg, #28c953, #76ff92);
    transition:.15s;
}

.modal-title{
    font-size:24px;
    margin:0 0 10px;
}

.modal-text{
    color:#9caf9f;
}

/* =========================
   FOOTER
========================= */

footer{
    padding:40px 20px;
    text-align:center;
    color:#68786c;
    border-top: 1px solid rgba(255,255,255,.05);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){
    .controls{
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width:600px){
    header{ min-height:370px; }
    .hero h1{ letter-spacing:-2px; }
    .controls{ grid-template-columns:1fr; }
    .section-head{ display:block; }
    .section-head h2{ font-size:27px; }
    .grid{ grid-template-columns:1fr; }
}

</style>
</head>


<body>

<!-- BACKGROUND -->
<div class="background">
    <div class="grid-bg"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<div class="particles" id="particles"></div>

<!-- HEADER -->
<header>
    <div class="hero">
        <div class="logo">⛏️</div>
        <h1>MC ARMENIA</h1>
        <p>Minecraft Mods & Resource Packs</p>

        <div class="hero-buttons">
            <button class="btn" onclick="scrollToMods()">🔥 Տեսնել մոդերը</button>
            <button class="btn secondary" onclick="setType('resourcepack')">🎨 Resource Packs</button>
        </div>
    </div>
</header>

<!-- MAIN -->
<main class="container" id="modsSection">

    <div class="section-head">
        <div>
            <h2 id="sectionTitle">🔥 Հանրաճանաչ Mods</h2>
            <p id="sectionSubtitle">Մոդեր, որոնք հասանելի են ընտրված Minecraft տարբերակի համար</p>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="panel">
        <div class="controls">
            <input id="search" class="input" type="text" placeholder="🔎 Փնտրել mod..." autocomplete="off">

            <select id="version" class="select">
                <option value="">Բեռնվում է...</option>
            </select>

            <select id="loader" class="select">
                <option value="">Բոլոր loaders</option>
                <option value="fabric">Fabric</option>
                <option value="forge">Forge</option>
                <option value="neoforge">NeoForge</option>
                <option value="quilt">Quilt</option>
            </select>

            <button class="btn" onclick="searchProjects()">Որոնել</button>
        </div>

        <div id="status" class="status">Բեռնվում է...</div>
    </div>

    <!-- RESULTS -->
    <div id="results" class="grid"></div>

</main>

<!-- DOWNLOAD MODAL -->
<div id="modal" class="modal">
    <div class="modal-box">
        <h2 id="modalTitle" class="modal-title">Ներբեռնում</h2>
        <p id="modalText" class="modal-text">Ֆայլը պատրաստվում է...</p>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <br>
        <button class="btn secondary" onclick="closeModal()">Փակել</button>
    </div>
</div>

<footer>
    <div>⛏️ MC Armenia</div>
    <div>Minecraft Mods & Resource Packs</div>
</footer>

<script>
/* =========================
   CONFIG
========================= */
const API = "https://api.modrinth.com/v2";
let currentType = "mod";
let projects = [];

/* =========================
   PARTICLES
========================= */
function createParticles(){
    const container = document.getElementById("particles");
    for(let i=0; i<55; i++){
        const particle = document.createElement("div");
        particle.className = "particle";
        particle.style.left = Math.random()*100 + "%";
        particle.style.animationDuration = (5 + Math.random()*10) + "s";
        particle.style.animationDelay = (-Math.random()*10) + "s";
        particle.style.opacity = Math.random();
        container.appendChild(particle);
    }
}

/* =========================
   HTML ESCAPE
========================= */
function escapeHTML(text){
    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================
   ARMENIAN DESCRIPTIONS
========================= */
function armenianDescription(project){
    const name = project.title.toLowerCase();
    if(name.includes("sodium")) return "Օպտիմիզացնում է Minecraft-ի գրաֆիկան և օգնում է բարձրացնել FPS-ը։";
    if(name.includes("lithium")) return "Օպտիմիզացնում է Minecraft-ի ներքին համակարգերը և բարելավում կատարողականությունը։";
    if(name.includes("ferritecore")) return "Նվազեցնում է հիշողության օգտագործումը և օգնում է Minecraft-ին աշխատել ավելի սահուն։";
    if(name.includes("entityculling")) return "Չի ցուցադրում այն օբյեկտները, որոնք խաղացողը չի կարող տեսնել՝ բարձրացնելով FPS-ը։";
    if(name.includes("jei")) return "Ցույց է տալիս Minecraft-ի իրերի և բլոկների բաղադրատոմսերը։";
    if(name.includes("xaero")) return "Ավելացնում է հարմար քարտեզ և օգտակար նավիգացիոն հնարավորություններ։";
    if(name.includes("journeymap")) return "Ավելացնում է մանրամասն քարտեզ և ճանապարհորդության օգտակար գործիքներ։";
    if(currentType === "resourcepack") return "Resource Pack, որը փոխում է Minecraft-ի տեսքը, տեքստուրաները և մթնոլորտը։";
    return "Minecraft-ի համար նախատեսված մոդ, որը ավելացնում է նոր հնարավորություններ կամ բարելավում խաղային փորձը։";
}

/* =========================
   LOAD VERSIONS
========================= */
async function loadVersions(){
    const select = document.getElementById("version");
    try{
        const response = await fetch(API + "/tag/game_version");
        if(!response.ok) throw new Error("Չհաջողվեց ստանալ տարբերակները");

        const data = await response.json();
        select.innerHTML = "";

        const releases = data.filter(item => item.version_type === "release");
        releases.forEach(item => {
            const option = document.createElement("option");
            option.value = item.version;
            option.textContent = "Minecraft " + item.version;
            select.appendChild(option);
        });

        if(releases.length){
            select.value = releases[0].version;
        }

        await searchProjects();
    }catch(error){
        select.innerHTML = `<option value="">Սխալ</option>`;
        document.getElementById("status").textContent = "Չհաջողվեց բեռնել Minecraft տարբերակները։";
    }
}

/* =========================
   SEARCH
========================= */
async function searchProjects(){
    const query = document.getElementById("search").value.trim();
    const version = document.getElementById("version").value;
    const loader = currentType === "mod" ? document.getElementById("loader").value : "";

    const results = document.getElementById("results");
    const status = document.getElementById("status");

    results.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
    status.textContent = "Որոնվում է...";

    try{
        const facets = [[`project_type:${currentType}`]];

        if(version) facets.push([`versions:${version}`]);
        if(loader && currentType === "mod") facets.push([`categories:${loader}`]);

        const url = `${API}/search?query=${encodeURIComponent(query)}&facets=${encodeURIComponent(JSON.stringify(facets))}&limit=20`;
        const response = await fetch(url);

        if(!response.ok) throw new Error("Որոնման սխալ");

        const data = await response.json();
        projects = data.hits || [];
        renderProjects();
    }catch(error){
        results.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <p>Տեղի ունեցավ սխալ տվյալները բեռնելիս։</p>
            </div>
        `;
        status.textContent = "Սխալ՝ որոնումը չհաջողվեց։";
    }
}

/* =========================
   RENDER PROJECTS
========================= */
function renderProjects(){
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    if(!projects.length){
        results.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🔍</div>
                <p>Ոչինչ չի գտնվել</p>
            </div>
        `;
        status.textContent = "Արդյունքներ չկան";
        return;
    }

    status.textContent = `Գտնվել է ${projects.length} արդյունք`;

    results.innerHTML = projects.map(project => {
        const title = escapeHTML(project.title);
        const description = escapeHTML(armenianDescription(project));
        const iconUrl = project.icon_url || 'https://via.placeholder.com/300x180?text=No+Image';
        const downloads = project.downloads ? project.downloads.toLocaleString() : 0;

        return `
            <div class="card">
                <div class="card-image-box">
                    <img src="${iconUrl}" class="card-image" alt="${title}">
                </div>
                <div class="card-body">
                    <div>
                        <h3 class="card-title">${title}</h3>
                        <p class="card-description">${description}</p>
                    </div>
                    <div>
                        <div class="tags">
                            <span class="tag">${project.project_type}</span>
                        </div>
                        <div class="card-bottom">
                            <button class="download-btn" onclick="downloadProject('${project.project_id}')">
                                ⬇️ Ներբեռնել
                            </button>
                            <span class="downloads">📥 ${downloads}</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

/* =========================
   UI FUNCTIONS
========================= */
function scrollToMods(){
    document.getElementById("modsSection").scrollIntoView({ behavior: "smooth" });
}

function setType(type){
    currentType = type;
    const loaderSelect = document.getElementById("loader");
    const title = document.getElementById("sectionTitle");
    const subtitle = document.getElementById("sectionSubtitle");

    if(type === "resourcepack"){
        loaderSelect.classList.add("loader-hidden");
        title.textContent = "🎨 Resource Packs";
        subtitle.textContent = "Տեքստուրաներ Minecraft-ի համար";
    }else{
        loaderSelect.classList.remove("loader-hidden");
        title.textContent = "🔥 Հանրաճանաչ Mods";
        subtitle.textContent = "Մոդեր, որոնք հասանելի են ընտրված Minecraft տարբերակի համար";
    }
    searchProjects();
}

async function downloadProject(projectId){
    const modal = document.getElementById("modal");
    const progressBar = document.getElementById("progressBar");
    const modalText = document.getElementById("modalText");

    modal.classList.add("show");
    progressBar.style.width = "40%";
    modalText.textContent = "Որոնվում է ճիշտ տարբերակի ֆայլը...";

    try{
        const selectedVersion = document.getElementById("version").value;
        const selectedLoader = document.getElementById("loader").value;

        const res = await fetch(`${API}/project/${projectId}/version`);
        const versions = await res.json();

        const targetVersion = versions.find(v => {
            const matchesVersion = !selectedVersion || v.game_versions.includes(selectedVersion);
            const matchesLoader = currentType !== "mod" || !selectedLoader || v.loaders.includes(selectedLoader);
            return matchesVersion && matchesLoader;
        }) || versions[0];

        if(targetVersion && targetVersion.files.length){
            progressBar.style.width = "100%";
            modalText.textContent = `Պատրաստ է (${targetVersion.game_versions[0]}): Սկսվում է ներբեռնումը...`;
            
            setTimeout(() => {
                window.location.href = targetVersion.files[0].url;
                closeModal();
            }, 800);
        }else{
            throw new Error();
        }
    }catch(e){
        modalText.textContent = "Չհաջողվեց գտնել ընտրված տարբերակի ֆայլը։";
        progressBar.style.width = "0%";
    }
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
    document.getElementById("progressBar").style.width = "0%";
}

window.addEventListener("DOMContentLoaded", () => {
    createParticles();
    loadVersions();

    document.getElementById("version").addEventListener("change", searchProjects);
    document.getElementById("loader").addEventListener("change", searchProjects);
});
</script>
